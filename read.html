<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Daily – Read</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            padding: 2rem 1rem;
            transition: background 0.3s, color 0.3s;
        }

        body.dark-mode {
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            padding: 2rem;
            transition: background 0.3s;
        }

        body.dark-mode .container {
            background: #1e293b;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .theme-toggle {
            float: right;
            background: none;
            border: 1px solid #cbd5e1;
            border-radius: 2rem;
            padding: 0.3rem 0.8rem;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        body.dark-mode .theme-toggle {
            border-color: #475569;
            color: #e2e8f0;
            background: #334155;
        }

        .post-content {
            line-height: 1.7;
            clear: both;
        }

        .post-content h1, .post-content h2, .post-content h3 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }

        .post-content h1 { 
            font-size: 2rem; 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 0.3em; 
        }

        body.dark-mode .post-content h1 {
            border-bottom-color: #334155;
        }

        .post-content h2 { font-size: 1.5rem; }
        .post-content p { margin-bottom: 1em; }

        .post-content pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            margin: 1rem 0;
        }

        .post-content code {
            background: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 0.375rem;
            font-family: 'Menlo', monospace;
            font-size: 0.875em;
        }

        body.dark-mode .post-content code {
            background: #334155;
            color: #f1f5f9;
        }

        .post-content pre code {
            background: transparent;
            padding: 0;
        }

        .post-content blockquote {
            border-left: 4px solid #9333ea;
            padding-left: 1rem;
            color: #475569;
            margin: 1rem 0;
        }

        body.dark-mode .post-content blockquote {
            color: #cbd5e1;
        }

        .post-content img {
            max-width: 100%;
            border-radius: 0.75rem;
            margin: 1rem 0;
        }

        .loader, .error {
            text-align: center;
            padding: 3rem;
        }

        .loader { color: #3b82f6; }
        .error { color: #b91c1c; background: #fee2e2; border-radius: 0.75rem; }

        .comments-section {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #e2e8f0;
        }

        body.dark-mode .comments-section {
            border-top-color: #334155;
        }

        .comments-section h3 {
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        @media (max-width: 640px) {
            .container { padding: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <button class="theme-toggle" id="themeToggle">🌙 Dark mode</button>
    <a href="index.html" class="back-link">← Back to all crystals</a>
    
    <div id="content" class="post-content">
        <div class="loader">Loading crystal...</div>
    </div>

    <div class="comments-section">
        <h3>💬 Comments</h3>
        <div id="cusdis_thread"
            data-host="https://cusdis.com"
            data-app-id="cf2b544d-28e7-4767-affc-55eb48e6d659"
            data-page-id=""
            data-page-url=""
            data-page-title=""
        ></div>
    </div>

    <footer>✨ Crystal Daily – Read, learn, grow.</footer>
</div>

<script>
    const GITHUB_USER = "zendrx";
    const GITHUB_REPO  = "crystal-daily";
    const POSTS_FOLDER = "posts";

    const urlParams = new URLSearchParams(window.location.search);
    const postFilename = urlParams.get('post');

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    if (!postFilename) {
        document.getElementById('content').innerHTML = '<div class="error">No post specified.</div>';
    } else {
        const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${POSTS_FOLDER}/${postFilename}`;
        fetch(rawUrl)
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.text();
            })
            .then(markdown => {
                const html = marked.parse(markdown);
                document.getElementById('content').innerHTML = html;
                document.title = `Crystal Daily – ${postFilename.replace(/\.md$/, '').replace(/-/g, ' ')}`;
                
                const pageId = postFilename;
                const pageTitle = postFilename.replace(/\.md$/, '').replace(/-/g, ' ');
                const pageUrl = window.location.href;
                
                const cusdisDiv = document.getElementById('cusdis_thread');
                if (cusdisDiv) {
                    cusdisDiv.setAttribute('data-page-id', pageId);
                    cusdisDiv.setAttribute('data-page-url', pageUrl);
                    cusdisDiv.setAttribute('data-page-title', pageTitle);
                }
                
                if (window.CUSDIS && typeof window.CUSDIS.load === 'function') {
                    window.CUSDIS.load();
                } else {
                    const script = document.createElement('script');
                    script.src = 'https://cusdis.com/js/cusdis.es.js';
                    script.async = true;
                    script.defer = true;
                    document.body.appendChild(script);
                }
            })
            .catch(err => {
                document.getElementById('content').innerHTML = `<div class="error">Failed to load post: ${escapeHtml(err.message)}</div>`;
            });
    }

    const themeToggle = document.getElementById('themeToggle');
    const isDarkMode = localStorage.getItem('darkMode') === 'true';
    
    if (isDarkMode) {
        document.body.classList.add('dark-mode');
        themeToggle.textContent = '☀️ Light mode';
    }
    
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const darkModeEnabled = document.body.classList.contains('dark-mode');
        localStorage.setItem('darkMode', darkModeEnabled);
        themeToggle.textContent = darkModeEnabled ? '☀️ Light mode' : '🌙 Dark mode';
    });
</script>
</body>
</html>
